library: airkorea
scenarios:
  - name: 에어코리아 호출은 긴 타임아웃(30초)과 DEBUG 실패 로그로 나간다
    description: 측정소 조회와 대기질 조회 모두 느린 응답을 기다려 주되, 실패해도 보완 수단이 있으므로 ERROR 로그를 남기지 않는다
    steps:
      - 에어코리아를_준비한다
      - 측정소_조회가_응답한다: 정상
      - 대기질_API가_응답한다: 정상
      - 대기질을_조회한다: {위도: 37.6, 경도: 127.09}
      - 에어코리아_호출은_긴_타임아웃과_DEBUG_로그를_쓴다: {호출수: 2}

  - name: 같은 위치에서는 측정소를 다시 조회하지 않는다
    description: 캐시된 측정소가 있고 위치가 같으면 측정소 조회 API 는 건너뛰고 대기질만 조회한다
    steps:
      - 에어코리아를_준비한다
      - 측정소가_캐시되어_있다: {이름: 화랑로, 코드: "111312", 위도: 37.6, 경도: 127.09}
      - 대기질_API가_응답한다: 정상
      - 대기질을_조회한다: {위도: 37.6, 경도: 127.09}
      - 에어코리아_API_호출_횟수를_확인한다: {종류: 측정소, 횟수: 0}
      - 에어코리아_API_호출_횟수를_확인한다: {종류: 대기질, 횟수: 1}
      - 결과_값을_확인한다: {키: pm10Value, 값: "23"}

  - name: 대기질 API 가 최종 실패해도 페이지 보완으로 채우고 경고를 남기지 않는다
    description: 보완이 성공하면 사용자에게 보이는 값이 있으므로 WARNING 은 필요 없다
    steps:
      - 에어코리아를_준비한다
      - 측정소가_캐시되어_있다: {이름: 화랑로, 코드: "111312", 위도: 37.6, 경도: 127.09}
      - 대기질_API가_응답한다: 실패
      - 페이지_보완이_성공한다
      - 대기질을_조회한다: {위도: 37.6, 경도: 127.09}
      - 결과_값을_확인한다: {키: pm10Value, 값: "30"}
      - 결과_값을_확인한다: {키: station, 값: 화랑로}
      - 경고_횟수를_확인한다: 0

  - name: 2km 이상 이동 후 측정소 이름 조회가 실패해도 측정소코드 기반 페이지 보완까지 이어진다
    description: 이름 조회에서 바로 포기하지 않고, 이름과 무관한 측정소코드 방식으로 값을 채운다
    steps:
      - 에어코리아를_준비한다
      - 측정소가_캐시되어_있다: {이름: 서석동, 코드: "999999", 위도: 35.145, 경도: 126.918}
      - 측정소_조회가_응답한다: 실패
      - 측정소코드_확보가_성공한다: "222333"
      - 페이지_보완이_성공한다
      - 대기질을_조회한다: {위도: 37.6, 경도: 127.09}
      - 결과_값을_확인한다: {키: pm10Value, 값: "30"}
      - 결과_값을_확인한다: {키: pm25Value, 값: "12"}
      - 결과에_키가_없다: station
      - 캐시된_측정소를_확인한다: {이름: null, 코드: "222333"}
      - 페이지_보완_호출을_확인한다: {횟수: 1, 코드: "222333"}
      - 에어코리아_API_호출_횟수를_확인한다: {종류: 대기질, 횟수: 0}
      - 경고_횟수를_확인한다: 0

  - name: 이전에 코드만 캐시됐다면 이동 후 오래된 코드를 버리고 새로 확보한다
    description: 이름 조회가 실패해 코드만 캐시된 상태에서 2km 넘게 이동하면 그 코드는 더 이상 믿을 수 없다
    steps:
      - 에어코리아를_준비한다
      - 측정소가_캐시되어_있다: {이름: null, 코드: OLD001, 위도: 35.145, 경도: 126.918}
      - 측정소_조회가_응답한다: 실패
      - 측정소코드_확보가_성공한다: NEW001
      - 페이지_보완이_성공한다
      - 대기질을_조회한다: {위도: 37.6, 경도: 127.09}
      - 측정소코드_확보_호출을_확인한다: {횟수: 1}
      - 캐시된_측정소를_확인한다: {이름: null, 코드: NEW001, 위도: 37.6, 경도: 127.09}

  - name: 모든 수단이 실패하면 경고는 딱 한 번만 남는다
    description: 일시적인 지연마다 로그가 쌓이지 않도록, 측정소 이름과 측정소코드 모두 실패했을 때만 WARNING 한 번
    steps:
      - 에어코리아를_준비한다
      - 측정소_조회가_응답한다: 실패
      - 대기질을_조회한다: {위도: 37.6, 경도: 127.09}
      - 결과를_확인한다: {값: {}}
      - 경고_횟수를_확인한다: 1

  - name: 측정소는 알지만 대기질 API 와 페이지 보완이 모두 실패하면 측정소 이름만 돌려주고 경고 한 번
    description: 기존 동작 유지 — 측정소 이름은 센서에 남기되 실패는 한 번만 알린다
    steps:
      - 에어코리아를_준비한다
      - 측정소_조회가_응답한다: 정상
      - 대기질_API가_응답한다: 비어있음
      - 대기질을_조회한다: {위도: 37.6, 경도: 127.09}
      - 결과를_확인한다: {값: {station: 화랑로}}
      - 경고_횟수를_확인한다: 1

  - name: 측정소 조회 API 가 미신청이면 빈 값을 돌려주고 페이지 보완은 시도하지 않는다
    description: 미신청은 실제 구독 문제이므로 보완으로 덮지 않고 그대로 알린다
    steps:
      - 에어코리아를_준비한다
      - 측정소_조회가_응답한다: 미신청
      - 측정소코드_확보가_성공한다: "222333"
      - 페이지_보완이_성공한다
      - 대기질을_조회한다: {위도: 37.6, 경도: 127.09}
      - 결과를_확인한다: {값: {}}
      - 페이지_보완_호출을_확인한다: {횟수: 0}

  - name: 주소(역지오코딩) 결과가 비어 있어도 측정소코드 확보와 대기질 조회가 이어진다
    description: 시/도명이 빈 문자열이어도 예외 없이 진행한다
    steps:
      - 에어코리아를_준비한다
      - 측정소_조회가_응답한다: 정상
      - 대기질_API가_응답한다: 정상
      - 측정소코드_확보가_성공한다: "111312"
      - 주소_조회_결과가_비어_있다
      - 대기질을_조회한다: {위도: 37.6, 경도: 127.09}
      - 결과_값을_확인한다: {키: pm10Value, 값: "23"}
      - 측정소코드_확보_호출을_확인한다: {횟수: 1, 인자: [37.6, 127.09, ""]}
