library: admin_area
scenarios:
  - name: 꽃가루를 먼저 조회하면 자외선지수는 같은 캐시를 그대로 재사용한다
    description: 두 API 는 지역코드표가 완전히 같아서, 같은 좌표로 지역을 두 번 계산하지 않는다
    steps:
      - 코디네이터를_준비한다
      - 캐시된_지역코드를_확인한다: {값: null}
      - 꽃가루_지역을_조회한다: {위도: 37.584137, 경도: 126.970652}
      - 캐시된_지역코드를_확인한다: "1111051500"
      - 자외선_지역을_조회한다: {위도: 37.584137, 경도: 126.970652}
      - 꽃가루_지역을_확인한다: {코드: "1111051500", 이름: 서울특별시 종로구 청운효자동}
      - 자외선_지역을_확인한다: {코드: "1111051500", 이름: 서울특별시 종로구 청운효자동}

  - name: 캐시가 있으면 지역 파일이 사라져도 같은 좌표에는 그대로 응답한다
    description: 같은 좌표를 다시 물으면 파일을 다시 읽지 않는다
    steps:
      - 코디네이터를_준비한다
      - 자외선_지역을_조회한다: {위도: 37.584137, 경도: 126.970652}
      - 지역파일을_더_읽을_수_없다
      - 자외선_지역을_조회한다: {위도: 37.584137, 경도: 126.970652}
      - 자외선_지역을_확인한다: {코드: "1111051500", 이름: 서울특별시 종로구 청운효자동}

  - name: 좌표가 바뀌면 캐시를 쓰지 않고 새 좌표로 다시 매칭한다
    description: 같은 캐시라도 다른 좌표에는 재사용하지 않는다 (이동한 기기의 지역이 옛 지역으로 남지 않도록)
    steps:
      - 코디네이터를_준비한다
      - 자외선_지역을_조회한다: {위도: 37.584137, 경도: 126.970652}
      - 자외선_지역을_확인한다: {코드: "1111051500", 이름: 서울특별시 종로구 청운효자동}
      - 자외선_지역을_조회한다: {위도: 35.1796, 경도: 129.0756}
      - 자외선_지역을_확인한다: {코드: "2647063000", 이름: 부산광역시 연제구 거제제3동}
      - 캐시된_지역코드를_확인한다: "2647063000"

  - name: 지역 파일을 읽지 못하면 빈 값을 돌려준다
    description: 파일 로드가 실패해도 예외 없이 조회 불가로 처리한다
    steps:
      - 코디네이터를_준비한다
      - 지역파일을_더_읽을_수_없다
      - 자외선_지역을_조회한다: {위도: 0.0, 경도: 0.0}
      - 자외선_지역을_확인한다: {코드: "", 이름: ""}
