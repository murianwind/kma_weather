library: area_codes
scenarios:
  - name: 처음에는 캐시가 비어 있고, 좌표로 구역코드 다섯 개를 결정한다
    description: 서울 중랑구 좌표 → 기온구역 11B20501, 육상구역 11B00000, 특보구역 L1100200
    steps:
      - 구역코드_코디네이터를_준비한다
      - 캐시가_비어_있다
      - 구역코드를_결정한다: {위도: 37.608025, 경도: 127.094222}
      - 구역코드는_다섯_개_값이다
      - 구역코드를_확인한다: {기온구역: 11B20501, 육상구역: 11B00000, 특보구역: L1100200}

  - name: 2km 이내로 이동하면 구역코드를 다시 계산하지 않고 캐시를 재사용한다
    description: 약 1km 이동해도 같은 값이고, 캐시의 기준 좌표는 최초 좌표로 유지된다
    steps:
      - 구역코드_코디네이터를_준비한다
      - 구역코드를_결정한다: {위도: 37.608025, 경도: 127.094222}
      - 구역코드를_결정한다: {위도: 37.615, 경도: 127.09}
      - 직전과_같은_결과다
      - 캐시된_좌표_위도를_확인한다: 37.608025

  - name: 2km 넘게 이동하면 구역코드를 다시 계산하고 기준 좌표도 새로 잡는다
    description: 중랑구에서 강남으로 이동하면 특보구역이 달라진다
    steps:
      - 구역코드_코디네이터를_준비한다
      - 구역코드를_결정한다: {위도: 37.608025, 경도: 127.094222}
      - 구역코드를_결정한다: {위도: 37.498, 경도: 127.027}
      - 직전과_특보구역이_다르다
      - 구역코드를_확인한다: {기온구역: 11B10101, 육상구역: 11B00000, 특보구역: L1100100}
      - 캐시된_좌표_위도를_확인한다: 37.498

  - name: 경계값 - 약 1.9km 이동은 캐시를 재사용한다 (2km 바로 안쪽)
    description: 기준 좌표에서 정북쪽으로 약 1.9km 떨어진 곳은 아직 같은 구역으로 본다
    steps:
      - 구역코드_코디네이터를_준비한다
      - 구역코드를_결정한다: {위도: 37.608025, 경도: 127.094222}
      - 구역코드를_결정한다: {위도: 37.625111, 경도: 127.094222}
      - 직전과_같은_결과다
      - 캐시된_좌표_위도를_확인한다: 37.608025

  - name: 경계값 - 약 2.1km 이동은 캐시를 버리고 다시 계산한다 (2km 바로 바깥쪽)
    description: 기준 좌표에서 정북쪽으로 약 2.1km 떨어지면 기준 좌표를 새 위치로 다시 잡는다
    steps:
      - 구역코드_코디네이터를_준비한다
      - 구역코드를_결정한다: {위도: 37.608025, 경도: 127.094222}
      - 구역코드를_결정한다: {위도: 37.626911, 경도: 127.094222}
      - 캐시된_좌표_위도를_확인한다: 37.626911

  - name: 구역이 새로 정해지면(11시 전) 오늘 오전·오후 요약을 모두 비운다
    description: 이동한 곳의 요약이 아니므로 옛 위치의 요약을 쓰지 않도록 비운다
    steps:
      - 현재시각을_고정한다: {시: 10, 분: 0}
      - 구역코드_코디네이터를_준비한다
      - 구역코드를_결정한다: {위도: 37.608025, 경도: 127.094222}
      - 오늘_요약을_기록해_둔다: {오전: 맑음, 오후: 흐림}
      - 구역코드를_결정한다: {위도: 37.498, 경도: 127.027}
      - 오늘_요약을_확인한다: {오전: null, 오후: null}

  - name: 구역이 새로 정해져도 11시 이후에는 이미 지난 오전 요약은 남기고 오후 요약만 비운다
    description: 낮에 이동해도 오전 요약(이미 지난 시간대)은 보존한다
    steps:
      - 현재시각을_고정한다: {시: 15, 분: 0}
      - 구역코드_코디네이터를_준비한다
      - 구역코드를_결정한다: {위도: 37.608025, 경도: 127.094222}
      - 오늘_요약을_기록해_둔다: {오전: 맑음, 오후: 흐림}
      - 구역코드를_결정한다: {위도: 37.498, 경도: 127.027}
      - 오늘_요약을_확인한다: {오전: 맑음, 오후: null}

  - name: 2km 이내 이동은 구역이 그대로라 요약도 비우지 않는다
    description: 캐시를 그대로 쓰는 경우에는 요약을 건드리지 않는다
    steps:
      - 현재시각을_고정한다: {시: 10, 분: 0}
      - 구역코드_코디네이터를_준비한다
      - 구역코드를_결정한다: {위도: 37.608025, 경도: 127.094222}
      - 오늘_요약을_기록해_둔다: {오전: 맑음, 오후: 흐림}
      - 구역코드를_결정한다: {위도: 37.615, 경도: 127.09}
      - 오늘_요약을_확인한다: {오전: 맑음, 오후: 흐림}

  - name: 경계값 - 10:59 에 구역이 새로 정해지면 오전 요약도 비운다 (11시 바로 전)
    description: 11시 이전이면 아직 오전 요약이 오늘 낮의 판단에 쓰이지 않으므로 함께 비운다
    steps:
      - 현재시각을_고정한다: {시: 10, 분: 59}
      - 구역코드_코디네이터를_준비한다
      - 구역코드를_결정한다: {위도: 37.608025, 경도: 127.094222}
      - 오늘_요약을_기록해_둔다: {오전: 맑음, 오후: 흐림}
      - 구역코드를_결정한다: {위도: 37.498, 경도: 127.027}
      - 오늘_요약을_확인한다: {오전: null, 오후: null}

  - name: 경계값 - 11:00 에 구역이 새로 정해지면 오전 요약은 남긴다 (11시 정각)
    description: 11시부터는 오전 요약을 보존하고 오후 요약만 비운다
    steps:
      - 현재시각을_고정한다: {시: 11, 분: 0}
      - 구역코드_코디네이터를_준비한다
      - 구역코드를_결정한다: {위도: 37.608025, 경도: 127.094222}
      - 오늘_요약을_기록해_둔다: {오전: 맑음, 오후: 흐림}
      - 구역코드를_결정한다: {위도: 37.498, 경도: 127.027}
      - 오늘_요약을_확인한다: {오전: 맑음, 오후: null}
