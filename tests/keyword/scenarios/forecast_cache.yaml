library: forecast_merge
scenarios:
  - name: 중기예보 수신이 실패해도 캐시로 D+3/D+4 가 유지된다
    description: 19:10 에 정상 병합한 뒤 중기예보만 실패(None)
    steps:
      - 예보_병합을_준비한다: {시: 19, 분: 10}
      - 예보를_병합한다
      - 예보를_병합한다: {중기: 실패}
      - D3_D4_예보가_모두_채워져_있다

  - name: 단기예보 수신이 실패해도 캐시로 D+3/D+4 가 유지된다
    description: 14:10 에 정상 병합한 뒤 단기예보만 실패(None)
    steps:
      - 예보_병합을_준비한다: {시: 14, 분: 10}
      - 예보를_병합한다
      - 예보를_병합한다: {단기: 실패}
      - D3_D4_예보가_모두_채워져_있다

  - name: 단기·중기가 연달아 세 번 실패해도 캐시가 유지된다
    description: 한 번 정상 병합한 뒤 두 API 모두 세 번 연속 실패해도 매번 D+3/D+4 가 채워진다
    steps:
      - 예보_병합을_준비한다: {시: 19, 분: 10}
      - 예보를_병합한다
      - 예보를_병합한다: {단기: 실패, 중기: 실패}
      - D3_D4_예보가_모두_채워져_있다
      - 예보를_병합한다: {단기: 실패, 중기: 실패}
      - D3_D4_예보가_모두_채워져_있다
      - 예보를_병합한다: {단기: 실패, 중기: 실패}
      - D3_D4_예보가_모두_채워져_있다

  - name: 캐시 없이 처음부터 실패하면 일 예보는 10칸이 비어 있는 채로 오류 없이 진행한다
    description: 첫 갱신부터 두 API 가 모두 실패한 경우에는 채울 데이터가 없다
    steps:
      - 예보_병합을_준비한다: {시: 10, 분: 10}
      - 예보를_병합한다: {단기: 실패, 중기: 실패}
      - 일_예보_항목은_열_개이고_기온은_비어_있다
