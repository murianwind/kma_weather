library: precip
scenarios:
  - name: 매시 갱신되며 지난 시간이 하나씩 '-'로 바뀐다
    description: 14:30 에는 15시 값이 보이고, 한 시간 뒤(15:30)에는 15시가 지난 시간이 되어 '-'로 바뀐다
    steps:
      - 예보를_준비한다: {강수량: {14: 1.0mm, 15: 2.0mm, 16: 3.0mm}}
      - 시각을_맞추고_갱신한다: {시: 14, 분: 30}
      - 속성값을_확인한다: {키: 15시, 값: 2.0}
      - 속성값을_확인한다: {키: 14시, 값: "-"}
      - 한시간이_지나고_갱신한다
      - 속성값을_확인한다: {키: 15시, 값: "-"}
      - 속성값을_확인한다: {키: 16시, 값: 3.0}
      - 속성_키가_하루_전체인지_확인한다

  - name: 05시 발표본(06시부터 시작) 06:16 갱신에서도 00시~23시 키가 모두 유지된다
    description: 첫 슬롯이 06시여도 지난 시간(00~06시)은 '-'로 채워지고 07시부터 값이 보인다
    steps:
      - 예보를_준비한다: {첫슬롯시: 6, 강수량: {9: 4.0mm}, 일수: 3}
      - 시각을_맞추고_갱신한다: {시: 6, 분: 16}
      - 속성_키가_하루_전체인지_확인한다
      - 속성값을_확인한다: {키: 06시, 값: "-"}
      - 속성값을_확인한다: {키: 07시, 값: 0}
      - 속성값을_확인한다: {키: 09시, 값: 4.0}

  - name: 자정을 넘기면 속성이 새로운 하루 기준으로 초기화된다
    description: 23:30 에는 모든 시간이 지났거나 현재라 '-', 00:30 에는 01시부터 새 값이 보인다
    steps:
      - 예보를_준비한다: {강수량: {1: 5.0mm}, 일수: 3}
      - 시각을_맞추고_갱신한다: {시: 23, 분: 30}
      - 속성값을_확인한다: {키: 23시, 값: "-"}
      - 시각을_맞추고_갱신한다: {시: 0, 분: 30, 일: 20}
      - 속성값을_확인한다: {키: 00시, 값: "-"}
      - 속성값을_확인한다: {키: 01시, 값: 5.0}

  - name: 눈이 오면 강수량 대신 적설량이 상태값과 속성에 쓰인다
    description: PTY=3(눈)인 시각은 SNO 값을 사용한다
    steps:
      - 예보를_준비한다: {눈: {8: 3.0cm, 9: 5.0cm}}
      - 시각을_맞추고_갱신한다: {시: 8, 분: 0}
      - 상태값을_확인한다: 3.0
      - 속성값을_확인한다: {키: 09시, 값: 5.0}
