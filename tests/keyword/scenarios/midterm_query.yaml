library: midterm
scenarios:
  - name: 기온·육상 두 번 조회하고 같은 발표 회차(tmFc)로 요청한다
    description: 결과는 (기온, 육상, 발표 시각) 세 값이고 발표 시각은 시간대 정보를 가진다
    steps:
      - 중기예보를_준비한다: {월: 4, 일: 11, 시: 10, 분: 0}
      - 중기예보를_조회한다
      - 결과는_세_값이다
      - 호출_횟수를_확인한다: 2
      - 첫_두_호출의_발표시각은_계산한_회차와_같다

  - name: 최신 회차가 빈 응답이면 이전 회차로 재시도해 값을 얻는다 (총 4번 호출)
    description: 기온·육상 각각 한 번씩 재시도한다
    steps:
      - 중기예보를_준비한다: {월: 6, 일: 1, 시: 10, 분: 0, 응답: 두번빈응답후정상}
      - 중기예보를_조회한다
      - 정상_값을_돌려준다
      - 호출_횟수를_확인한다: 4

  - name: 재시도도 빈 응답이면 값은 비어 있어도 발표 시각은 돌려준다
    description: 기온·육상 각각 두 번(최신, 이전 회차)씩 모두 비어 있는 경우
    steps:
      - 중기예보를_준비한다: {월: 6, 일: 1, 시: 10, 분: 0, 응답: 빈응답}
      - 중기예보를_조회한다
      - 발표_시각은_돌려준다
      - 호출_횟수를_확인한다: 4

  - name: 미신청 응답이면 미신청 신호를 돌려준다
    description: 첫째 값이 UNSUBSCRIBED, 육상은 None — 업데이트 중단 신호로 쓰인다
    steps:
      - 중기예보를_준비한다: {월: 6, 일: 1, 시: 10, 분: 0, 응답: 미신청}
      - 중기예보를_조회한다
      - 미신청_신호를_돌려준다

  - name: 06시 회차(06:31)의 재시도는 전날 18시 회차로 간다
    description: 06시 회차에서 빈 응답이면 직전 회차인 전날 18시로 거슬러 올라간다
    steps:
      - 중기예보를_준비한다: {월: 6, 일: 1, 시: 6, 분: 31, 응답: 빈응답}
      - 발표_회차_시각을_확인한다: 6
      - 중기예보를_조회한다
      - 재시도_발표시각은_다음으로_끝난다: {끝자리: "1800"}

  - name: 18시 회차(18:31)의 재시도는 당일 06시 회차로 간다
    description: 18시 회차에서 빈 응답이면 직전 회차인 당일 06시로 거슬러 올라간다
    steps:
      - 중기예보를_준비한다: {월: 6, 일: 1, 시: 18, 분: 31, 응답: 빈응답}
      - 발표_회차_시각을_확인한다: 18
      - 중기예보를_조회한다
      - 재시도_발표시각은_다음으로_끝난다: {끝자리: "0600"}
