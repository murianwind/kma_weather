library: pause_zone
scenarios:
  - name: 집에 오래 머무는 동안에는 정기 업데이트가 API 를 호출하지 않는다
    description: 존 안에서는 매시 :15 업데이트가 와도 일시정지 상태를 유지한다 (이 동작은 기존과 동일)
    steps:
      - 기기를_등록한다
      - 정기업데이트가_실행된다
      - 정기업데이트가_실행된다
      - 정기업데이트가_실행된다
      - API_호출횟수를_확인한다: 0
      - 존_안_상태를_확인한다: true

  - name: 25분에 집을 나서면 5분 뒤 한 번 갱신된다
    description: 다음 :15 까지 45분이나 남아 있으므로 오래된 데이터를 보지 않도록 즉시 갱신한다
    steps:
      - 기기를_등록한다
      - 현재시각을_설정한다: {시: 10, 분: 25}
      - 위치를_이동한다: 집 밖
      - 예약된_대기가_있는지_확인한다: true
      - 시간이_흐른다: {분: 4}
      - API_호출횟수를_확인한다: 0
      - 시간이_흐른다: {분: 1}
      - API_호출횟수를_확인한다: 1
      - 존_안_상태를_확인한다: false

  - name: 58분에 집을 나서면 5분 뒤(01분)엔 갱신하지 않고 :15 정기 업데이트에 맡긴다
    description: 판정 시각이 0~14분이면 곧 올 :15 정기 업데이트와 중복되므로 이벤트 갱신을 생략한다
    steps:
      - 기기를_등록한다
      - 현재시각을_설정한다: {시: 10, 분: 58}
      - 위치를_이동한다: 집 밖
      - 시간이_흐른다: {분: 5}
      - API_호출횟수를_확인한다: 0
      - 시간이_흐른다: {분: 12}
      - 정기업데이트가_실행된다
      - API_호출횟수를_확인한다: 1

  - name: 경계에서 위치가 흔들려도 마지막 이탈 기준으로 한 번만 갱신한다
    description: 이탈 → 재진입 → 이탈을 반복해도 대기 예약은 하나만 남는다
    steps:
      - 기기를_등록한다
      - 현재시각을_설정한다: {시: 10, 분: 25}
      - 위치를_이동한다: 집 밖
      - 시간이_흐른다: {분: 2}
      - 위치를_이동한다: 집
      - 예약된_대기가_있는지_확인한다: false
      - 시간이_흐른다: {분: 1}
      - 위치를_이동한다: 집 밖
      - 시간이_흐른다: {분: 4}
      - API_호출횟수를_확인한다: 0
      - 시간이_흐른다: {분: 1}
      - API_호출횟수를_확인한다: 1

  - name: 대기 중 :15 정기 업데이트가 성공하면 이벤트 갱신은 생략한다
    description: 이탈 이후 이미 성공한 갱신이 있으면 같은 데이터를 다시 받지 않는다
    steps:
      - 기기를_등록한다
      - 현재시각을_설정한다: {시: 10, 분: 11}
      - 위치를_이동한다: 집 밖
      - 시간이_흐른다: {분: 4}
      - 정기업데이트가_실행된다
      - API_호출횟수를_확인한다: 1
      - 시간이_흐른다: {분: 1}
      - API_호출횟수를_확인한다: 1

  - name: 대기 중 :15 정기 업데이트가 실패하면 대기 판정이 다시 갱신을 시도한다
    description: 성공한 갱신이 없으면 오래된 데이터를 방치하지 않는다
    steps:
      - 기기를_등록한다
      - 현재시각을_설정한다: {시: 10, 분: 11}
      - 위치를_이동한다: 집 밖
      - 시간이_흐른다: {분: 4}
      - 정기업데이트가_실행된다: {결과: 실패}
      - API_호출횟수를_확인한다: 1
      - 시간이_흐른다: {분: 1}
      - API_호출횟수를_확인한다: 2
