# 자외선지수 센서가 코디네이터의 uv 데이터를 상태/속성/가용성으로 어떻게 노출하는가 (동등분할)
# 센서: uv_value(숫자) / uv_grade(등급 문자열) — hourly 속성은 uv_grade 에서 숫자 → 등급으로 변환됨
# approved: 'uv' API 승인 여부 (available 판정용), 기대_* 가 없으면 확인하지 않음
- id: UX01
  분류: 값 센서 - 정수 값
  센서: uv_value
  uv: {value: "6", grade: 높음}
  기대_상태: 6
- id: UX02
  분류: 값 센서 - 소수 값은 소수 그대로
  센서: uv_value
  uv: {value: "6.5", grade: 높음}
  기대_상태: 6.5
- id: UX03
  분류: 등급 센서 - 등급 문자열
  센서: uv_grade
  uv: {value: "6", grade: 높음}
  기대_상태: 높음
- id: UX04
  분류: 미신청이면 상태 없음
  센서: uv_value
  uv: null
  기대_상태: null
  기대_속성: null
- id: UX05
  분류: 자료 없음(resultCode 03 → 빈 딕셔너리)이면 상태 없음
  센서: uv_value
  uv: {}
  기대_상태: null
- id: UX06
  분류: 발표 시각과 지역이 속성에 포함
  센서: uv_value
  uv: {value: "6", grade: 높음, announcement: 2026년 08월 16일 06시 발표, area_name: 서울특별시 종로구 청운효자동}
  기대_속성: {발표 시각: 2026년 08월 16일 06시 발표, 지역: 서울특별시 종로구 청운효자동}
- id: UX07
  분류: 값 센서 - 시간대별 값이 키로 감싸지지 않고 숫자 그대로 펼쳐짐
  센서: uv_value
  uv: {value: "6", grade: 높음, announcement: 발표, area_name: 청운효자동, hourly: {08/16 09시: 1.0, 08/16 12시: 6.0}}
  기대_속성: {발표 시각: 발표, 지역: 청운효자동, 08/16 09시: 1.0, 08/16 12시: 6.0}
- id: UX08
  분류: 등급 센서 - 시간대별 값이 등급(낮음/높음/위험)으로 변환됨
  센서: uv_grade
  uv: {value: "6", grade: 높음, announcement: 발표, area_name: 청운효자동, hourly: {08/16 09시: 1.0, 08/16 12시: 6.0, 08/16 15시: 12.0}}
  기대_속성: {발표 시각: 발표, 지역: 청운효자동, 08/16 09시: 낮음, 08/16 12시: 높음, 08/16 15시: 위험}
- id: UX11
  분류: 지역·발표 시각이 없으면 '지역' 속성은 빼고 발표 시각은 '-'로 표시
  센서: uv_value
  uv: {value: "6", grade: 높음, hourly: {08/16 09시: 1.0, 08/16 12시: 6.0}}
  기대_속성: {발표 시각: "-", 08/16 09시: 1.0, 08/16 12시: 6.0}
- id: UX09
  분류: 승인된 상태면 센서 사용 가능
  센서: uv_value
  uv: {value: "6", grade: 높음}
  approved: [uv]
  기대_가용: true
- id: UX10
  분류: 승인되지 않은 상태면 센서 사용 불가
  센서: uv_value
  uv: null
  approved: []
  기대_가용: false
