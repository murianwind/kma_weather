# _get_warning: API 가 돌려준 특보 항목(items) → 센서에 표시되는 특보 문자열
# 기법: 동등분할(EP) — command/cancel/endTime/warnStress 종류별 대표 항목,
#       경계값분석(BVA) — 같은 종류의 특보가 여러 번 발표됐을 때 발표 시각(tmFc)이 최신인 것이 기준
# 항목 필드: command(1 발표·3 연장·6 정정·7 변경발표 = 유효, 2 해제·8 변경해제 = 제외) / cancel(0 이어야 유효) /
#           endTime(0 이어야 유효, 종료 시각이 있으면 이미 끝난 특보) / warnVar(특보 종류) / warnStress(0 주의보·1 경보·2 중대경보) / tmFc(발표 시각)
- id: WI01
  분류: 신규 발표된 건조주의보
  항목: [{command: "1", cancel: "0", endTime: "0", warnVar: "4", warnStress: "0"}]
  기대: 건조주의보
- id: WI02
  분류: 연장(command 3)도 유효한 특보
  항목: [{command: "3", cancel: "0", endTime: "0", warnVar: "4", warnStress: "0"}]
